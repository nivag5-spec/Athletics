<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>Wodonga Athletics Timer</title>
    <style>
        :root {
            --seiko-yellow: #f1c40f;
            --screen-bg: #c5cda8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }
        .stopwatch-case {
            background-color: rgb(105, 45, 65);
            width: 100%;
            max-width: 380px;
            border-radius: 40px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 4px solid rgb(85, 30, 48);
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .brand {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            letter-spacing: 1.5px;
            color: #ecf0f1;
            margin-bottom: 2px;
            text-transform: uppercase;
        }
        .model {
            text-align: center;
            font-size: 11px;
            color: var(--seiko-yellow);
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .lcd-screen {
            background-color: var(--screen-bg);
            color: #111;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            padding: 10px 12px;
            border: 5px solid #111;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            margin-bottom: 15px;
            border-radius: 10px;
        }
        .lcd-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 3px;
            line-height: 1.2;
        }
        .lcd-main-time {
            font-size: 38px;
            text-align: right;
            font-weight: 900;
            letter-spacing: -1px;
            margin-top: 2px;
            line-height: 1;
        }
        .button-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .seiko-btn {
            height: 70px;
            border-radius: 15px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0 #111;
            transition: all 0.05s ease;
            text-transform: uppercase;
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent;
        }
        .seiko-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #111;
        }
        #btn-left { background-color: #e74c3c; }
        #btn-right { background-color: #27ae60; }

        .printer-frame {
            width: 100%;
            max-width: 380px;
        }
        .printer-roll-container {
            background: #fff;
            color: #000;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            height: 320px; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }
        .printer-header {
            border-bottom: 2px dashed #666;
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
        }
        .results-table th {
            font-size: 12px;
            text-transform: uppercase;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
            text-align: left;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .results-table td {
            padding: 6px 4px;
            font-size: 14px;
            font-family: monospace;
        }
        .results-table input[type="text"] {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-family: sans-serif;
            font-size: 14px;
        }
        .action-controls {
            margin-top: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .action-btn {
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            text-transform: uppercase;
            text-align: center;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }
        #csv-btn { background-color: #2c3e50; color: white; }
        #csv-btn:hover { background-color: #34495e; }
        #btn-clear-all { background-color: #95a5a6; color: white; }
        #btn-clear-all:hover { background-color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="stopwatch-case">
        <div class="brand">Wodonga Athletics</div>
        <div class="model" id="sub-header-text">LOADING...</div>

        <div class="lcd-screen">
            <div class="lcd-row">
                <span>CLOCK:</span>
                <span id="lcd-live-clock">--/--/---- --:--:--</span>
            </div>
            <div class="lcd-row">
                <span id="lcd-state">CHRONO</span>
                <span id="lcd-block">BLOCK: 01</span>
            </div>
            <div class="lcd-row">
                <span>SPLIT NO: <span id="lcd-split-count">00</span></span>
                <span id="lcd-prev-split">00:00.00</span>
            </div>
            <div class="lcd-main-time" id="lcd-time">00:00.00</div>
        </div>

        <div class="button-container">
            <button class="seiko-btn" id="btn-left">Reset</button>
            <button class="seiko-btn" id="btn-right">Start<br>Stop</button>
        </div>
    </div>

    <div class="printer-frame">
        <div class="printer-roll-container" id="roll-window">
            <div class="printer-header">
                <strong>*** WODONGA ATHLETICS PRINT-OUT ***</strong><br>
                <span id="print-timestamp">DATE: --/--/---- &nbsp;&nbsp; TIME: --:--:--</span>
            </div>
            
            <table class="results-table">
                <thead>
                    <tr>
                        <th style="width: 15%;">Plc</th>
                        <th style="width: 40%;">Split Time</th>
                        <th style="width: 45%;">Athlete Name</th>
                    </tr>
                </thead>
                <tbody id="printer-body"></tbody>
            </table>
        </div>

        <div class="action-controls">
            <button id="btn-clear-all" class="action-btn">Clear Roll Memory</button>
            <button id="csv-btn" class="action-btn">Export to CSV</button>
        </div>
    </div>

    <script>
// ==========================================
        // EASY TO FIND CONFIGURATION AT THE TOP
        // ==========================================
        const VERSION_NUMBER = "V013"; 
        // ==========================================

        document.getElementById('sub-header-text').textContent = `Digital Stopwatch [${VERSION_NUMBER}]`;

        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;
        let liveClockInterval = null;
        let isRunning = false;
        let splitCount = 0;
        let hasTimestamped = false;

        // Hidden array to accurately track ALL events for the CSV in chronological order
        let csvLog = [];

        let audioCtx = null;

        const lcdTime = document.getElementById('lcd-time');
        const lcdSplitCount = document.getElementById('lcd-split-count');
        const lcdPrevSplit = document.getElementById('lcd-prev-split');
        const lcdState = document.getElementById('lcd-state');
        const lcdLiveClock = document.getElementById('lcd-live-clock');
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnClearAll = document.getElementById('btn-clear-all');
        const printerBody = document.getElementById('printer-body');
        const rollWindow = document.getElementById('roll-window');
        const csvBtn = document.getElementById('csv-btn');
        const printTimestampSpan = document.getElementById('print-timestamp');

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playLapBeep() {
            try {
                initAudio();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(2000, audioCtx.currentTime); 
                
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);

                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.08);
            } catch (error) {
                console.log("Audio play prevented:", error);
            }
        }

        function playBigStartStopSound() {
            try {
                initAudio();
                const duration = 0.22;
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc1.connect(gainNode);
                osc2.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc1.type = 'triangle'; 
                osc1.frequency.setValueAtTime(850, audioCtx.currentTime);
                
                osc2.type = 'sine'; 
                osc2.frequency.setValueAtTime(1200, audioCtx.currentTime);

                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                osc1.start(audioCtx.currentTime);
                osc2.start(audioCtx.currentTime);
                
                osc1.stop(audioCtx.currentTime + duration);
                osc2.stop(audioCtx.currentTime + duration);
            } catch (error) {
                console.log("Audio play prevented:", error);
            }
        }

        function triggerHapticFeedback(duration) {
            if (navigator.vibrate) {
                navigator.vibrate(duration);
            }
        }

        function stampCurrentTime() {
            const now = new Date();
            const day = now.getDate();
            const month = now.getMonth() + 1;
            const year = now.getFullYear();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');

            printTimestampSpan.innerHTML = `DATE: ${day}/${month}/${year} &nbsp;&nbsp; TIME: ${hours}:${minutes}:${seconds}`;
            hasTimestamped = true;
        }

        function resetTimestampUI() {
            printTimestampSpan.innerHTML = `DATE: --/--/---- &nbsp;&nbsp; TIME: --:--:--`;
            hasTimestamped = false;
        }

        function updateLiveClock() {
            const now = new Date();
            const day = now.getDate().toString().padStart(2, '0');
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const year = now.getFullYear();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            
            lcdLiveClock.textContent = `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
        }

        function formatTime(ms, isMainDisplay = false) {
            let totalSeconds = Math.floor(ms / 1000);
            let minutes = Math.floor(totalSeconds / 60);
            let hours = Math.floor(minutes / 60);
            
            let displayHours = hours > 0 ? hours.toString().padStart(2, '0') + ":" : "";
            let displayMins = (minutes % 60).toString().padStart(2, '0');
            let displaySecs = (totalSeconds % 60).toString().padStart(2, '0');
            
            if (isMainDisplay && ms >= 600000) { 
                return `${displayHours}${displayMins}:${displaySecs}`;
            } else {
                let displayCentis = Math.floor((ms % 1000) / 10).toString().padStart(2, '0');
                return `${displayHours}${displayMins}:${displaySecs}.${displayCentis}`;
            }
        }

        function getFormattedTOD() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');
            const milliseconds = now.getMilliseconds().toString().padStart(3, '0');
            return `${hours}:${minutes}:${seconds}.${milliseconds}`;
        }

        function updateDisplay() {
            const now = Date.now();
            const currentTotal = elapsedTime + (now - startTime);
            lcdTime.textContent = formatTime(currentTotal, true);
        }

        btnRight.addEventListener('click', (e) => {
            e.preventDefault();
            playBigStartStopSound(); 
            triggerHapticFeedback(120); 

            const tod = getFormattedTOD();

            if (!isRunning) {
                isRunning = true;
                startTime = Date.now();
                timerInterval = setInterval(updateDisplay, 10);
                lcdState.textContent = "RUN";
                btnLeft.innerHTML = "Lap / Split";
                
                if (!hasTimestamped) {
                    stampCurrentTime();
                }

                // Log START line to CSV tracking
                csvLog.push({ type: 'marker', text: `--- START/RESUME Pressed ---`, tod: tod });
            } else {
                isRunning = false;
                const totalAtStop = elapsedTime + (Date.now() - startTime);
                elapsedTime = totalAtStop;
                clearInterval(timerInterval);
                lcdState.textContent = "STOP";
                btnLeft.innerHTML = "Reset";
                
                lcdTime.textContent = formatTime(totalAtStop, true);
                
                // 1. Log the final split time data row
                recordSplit(formatTime(totalAtStop, false), true, tod);
                // 2. Log a explicit STOP action line right below it
                csvLog.push({ type: 'marker', text: `--- STOP Pressed ---`, tod: tod });
            }
        });

        btnLeft.addEventListener('click', (e) => {
            e.preventDefault();
            if (isRunning) {
                playLapBeep();
                triggerHapticFeedback(50);

                const now = Date.now();
                const totalSplitTime = elapsedTime + (now - startTime);
                const formattedSplit = formatTime(totalSplitTime, false); 
                
                lcdPrevSplit.textContent = formattedSplit;
                recordSplit(formattedSplit, false, getFormattedTOD());
            } else {
                playLapBeep();
                triggerHapticFeedback(50);

                startTime = 0;
                elapsedTime = 0;
                splitCount = 0;
                csvLog = []; // Reset CSV logs
                
                lcdTime.textContent = "00:00.00";
                lcdPrevSplit.textContent = "00:00.00";
                lcdSplitCount.textContent = "00";
                lcdState.textContent = "CHRONO";
                btnLeft.innerHTML = "Reset";
                
                resetTimestampUI(); 
            }
        });

        function recordSplit(timeStr, isFinalStop = false, todStr = "") {
            let displayPlace = "";

            if (isFinalStop) {
                displayPlace = "S";
            } else {
                splitCount++;
                displayPlace = splitCount.toString().padStart(2, '0');
                lcdSplitCount.textContent = displayPlace;
            }

            const timeOfDayStr = todStr || getFormattedTOD();

            // Append row markup visually onto the screen roll
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${displayPlace}</td>
                <td><strong>${timeStr}</strong></td>
                <td><input type="text" placeholder="Type athlete..." class="athlete-name"></td>
            `;
            printerBody.appendChild(tr);
            rollWindow.scrollTop = rollWindow.scrollHeight;

            // Cache a clean reference linked to this specific row element in our CSV state
            csvLog.push({
                type: 'data',
                place: displayPlace,
                time: timeStr,
                tod: timeOfDayStr,
                rowRef: tr
            });
        }

        btnClearAll.addEventListener('click', () => {
            if(confirm("Clear out all documented results on the current roll?")) {
                printerBody.innerHTML = "";
                csvLog = [];
                if(!isRunning) {
                    splitCount = 0;
                    lcdSplitCount.textContent = "00";
                    resetTimestampUI();
                }
            }
        });

        csvBtn.addEventListener('click', () => {
            if (csvLog.length === 0) {
                alert("No logged sprint times available to export yet.");
                return;
            }

            function generateCSV(lat = "Not available", lon = "Not available") {
                const headerText = printTimestampSpan.textContent || "";
                const dateMatch = headerText.match(/DATE:\s*([^\s]+)/);
                const timeMatch = headerText.match(/TIME:\s*([^\s]+)/);
                
                const raceDate = dateMatch ? dateMatch[1] : "--/--/----";
                const raceStartTime = timeMatch ? timeMatch[1] : "--:--:--";

                let csvContent = "";
                csvContent += `"WODONGA ATHLETICS EVENT LOG"\n`;
                csvContent += `"Date","${raceDate}"\n`;
                csvContent += `"Start Time","${raceStartTime}"\n`;
                csvContent += `"GPS Latitude","${lat}"\n`;
                csvContent += `"GPS Longitude","${lon}"\n`;
                csvContent += `\n`; 
                
                csvContent += "Place,Split Time,Time of Day,Athlete Name\n";

                // Loop through our tracking array which captures lines chronologically
                csvLog.forEach(item => {
                    if (item.type === 'marker') {
                        // Insert an isolated action header line across columns
                        csvContent += `"${item.text}","","${item.tod}",""\n`;
                    } else if (item.type === 'data') {
                        // Extract user input text directly out of the live screen element reference
                        const inputEl = item.rowRef.querySelector('input');
                        const name = inputEl ? inputEl.value.replace(/"/g, '""') : "";
                        
                        csvContent += `"${item.place}","${item.time}","${item.tod}","${name}"\n`;
                    }
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", `wodonga_aths_race_${Date.now()}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        generateCSV(position.coords.latitude.toFixed(6), position.coords.longitude.toFixed(6));
                    },
                    (error) => {
                        console.log("GPS error or denied:", error);
                        generateCSV(); 
                    },
                    { enableHighAccuracy: true, timeout: 3000 }
                );
            } else {
                generateCSV(); 
            }
        });

        updateLiveClock();
        liveClockInterval = setInterval(updateLiveClock, 1000);
    </script>
</body>
</html>
